[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-recognition"
version = "0.1.0"
description = "SignFlow-BdSL: Robust Real-Time Bangla Sign Language Word Recognition Using Holistic Spatiotemporal Features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "opencv-python>=4.10",
  "mediapipe>=0.10.11",
  "pytest>=8.0",
  "mlflow>=2.12",
  "tensorboard>=2.16",
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "websockets>=12.0",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "plotly>=5.0",
  "torchmetrics>=1.4",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24.4",
]

[project.optional-dependencies]
full = []
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
