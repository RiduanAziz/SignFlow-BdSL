project_name: signflow-bdsl
seed: 42
checkpoint_dir: checkpoints/bdslw131
results_dir: results/bdslw131

dataset:
  train_manifest: data/manifests/bdslw131_train_manifest.json
  val_manifest: data/manifests/bdslw131_val_manifest.json
  test_manifest: data/manifests/bdslw131_test_manifest.json
  landmarks_dir: data/landmarks
  num_classes: 131

model:
  name: robust_holistic_fusion
  input_dim: 1659
  num_classes: 131
  embedding_dim: 64
  hidden_dim: 128
  num_layers: 1
  sequence_length: 1
  dropout: 0.2

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip: 1.0

evaluation:
  validation_split: validation
  test_split: test
  primary_metric: macro_f1
